<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCRP concept responsive QA harness</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; background: #dfe5ed; font-family: "Segoe UI", sans-serif; }
    iframe { display: block; margin: 0; background: #fff; border: 0; }
    #runInteraction { position: fixed; z-index: 3; right: .75rem; bottom: .75rem; min-height: 44px; padding: .65rem .9rem; color: #fff; background: #174ea6; border: 2px solid #fff; font-weight: 750; }
    #qaOutput { position: fixed; z-index: 2; right: .75rem; bottom: 4.25rem; left: .75rem; max-height: 28vh; padding: .7rem; overflow: auto; overflow-wrap: anywhere; color: #172033; background: #fff; border: 1px solid #8c99ab; font-size: 12px; }
  </style>
</head>
<body>
  <iframe id="qaFrame" title="NCRP golden-screen concept under test"></iframe>
  <output id="qaOutput" hidden data-status="loading"></output>
  <button id="runInteraction" type="button">Run concept interaction</button>

  <script>
    const params = new URLSearchParams(location.search);
    const requiredViewports = Object.freeze(["1440x900", "1024x768", "390x844", "320x568"]);
    const concepts = new Set(["parallel-ledger", "guided-verification", "continuous-thread"]);
    const concept = concepts.has(params.get("concept")) ? params.get("concept") : "parallel-ledger";
    const width = Math.max(320, Math.min(1440, Number(params.get("width")) || 1440));
    const height = Math.max(568, Math.min(900, Number(params.get("height")) || 900));
    const frame = document.querySelector("#qaFrame");
    const output = document.querySelector("#qaOutput");
    const runButton = document.querySelector("#runInteraction");
    const wait = (milliseconds = 60) => new Promise((resolve) => setTimeout(resolve, milliseconds));

    frame.width = String(width);
    frame.height = String(height);
    document.documentElement.style.width = width + "px";
    document.body.style.width = width + "px";
    window.__frameErrors = [];

    const visible = (element, win) => {
      if (!element) return false;
      const style = win.getComputedStyle(element);
      const rect = element.getBoundingClientRect();
      return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
    };

    const snapshot = () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const ids = [...doc.querySelectorAll("[id]")].map((element) => element.id);
      const duplicateIds = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
      const headings = [...doc.querySelectorAll("h1")].filter((element) => visible(element, win));
      const shortControls = [...doc.querySelectorAll("button, input, select, textarea, [role=button]")]
        .filter((element) => visible(element, win) && element.getBoundingClientRect().height < 43.5)
        .map((element) => element.id || element.textContent.trim().slice(0, 50));
      const text = doc.body.innerText;

      return {
        concept,
        width: win.innerWidth,
        height: win.innerHeight,
        title: doc.title,
        visibleH1Count: headings.length,
        h1: headings[0]?.textContent.trim() || null,
        horizontalOverflow: doc.documentElement.scrollWidth > win.innerWidth + 1,
        duplicateIds,
        shortControls,
        hasMain: Boolean(doc.querySelector("main")),
        hasIdentity: /National Cyber Crime Reporting Portal/.test(text),
        hasBoundary: /Independent concept redesign/.test(text) && /synthetic data/i.test(text),
        hasOfficialGuidance: /1930/.test(text) && /cybercrime\.gov\.in/.test(text),
        hasCanonicalFacts: /₹25,000/.test(text) && /dealdesk@upi/.test(text) && /419825901772/.test(text),
        hasReadinessStates: /Ready/.test(text) && /Missing/.test(text) && /Optional/.test(text),
        publicCodenameAbsent: !/\bThreadZero\b|\btz\b/i.test(text),
        errors: [...window.__frameErrors]
      };
    };

    window.__qaSnapshot = snapshot;

    window.__runConceptInteraction = async () => {
      const doc = frame.contentDocument;
      const checks = {};
      const assertCheck = (name, value) => {
        checks[name] = Boolean(value);
        if (!value) throw new Error("QA assertion failed: " + name);
      };
      const before = snapshot();

      assertCheck("oneVisibleH1", before.visibleH1Count === 1);
      assertCheck("noHorizontalOverflow", before.horizontalOverflow === false);
      assertCheck("noDuplicateIds", before.duplicateIds.length === 0);
      assertCheck("controlsAtLeast44px", before.shortControls.length === 0);
      assertCheck("publicIdentity", before.hasIdentity);
      assertCheck("conceptBoundary", before.hasBoundary);
      assertCheck("officialGuidance", before.hasOfficialGuidance);
      assertCheck("canonicalFacts", before.hasCanonicalFacts);
      assertCheck("readinessStates", before.hasReadinessStates);
      assertCheck("publicCodenameAbsent", before.publicCodenameAbsent);

      const confirm = doc.querySelector("[data-confirm-extraction]");
      const attach = doc.querySelector("[data-attach-evidence]");
      assertCheck("confirmAvailable", Boolean(confirm) && confirm.disabled === false);
      assertCheck("attachInitiallyGuarded", Boolean(attach) && attach.disabled === true);

      confirm.click();
      await wait();
      assertCheck("extractionConfirmed", confirm.disabled === true && attach.disabled === false);
      assertCheck("confirmationAnnounced", /confirmed/i.test(doc.querySelector("[data-live-region]")?.textContent || ""));

      attach.click();
      await wait(260);
      const target = doc.querySelector("[data-event-target]");
      assertCheck("evidenceAttached", doc.body.dataset.phase === "attached");
      assertCheck("attachedProofVisible", [...doc.querySelectorAll("[data-attached-proof]")].some((proof) => visible(proof, frame.contentWindow)));
      assertCheck("targetFocused", doc.activeElement === target);
      assertCheck("attachmentAnnounced", /attached/i.test(doc.querySelector("[data-live-region]")?.textContent || ""));

      const after = snapshot();
      assertCheck("noErrors", after.errors.length === 0);
      assertCheck("stillOneVisibleH1", after.visibleH1Count === 1);
      assertCheck("stillNoHorizontalOverflow", after.horizontalOverflow === false);
      return { checks, before, after };
    };

    frame.addEventListener("load", () => {
      window.__frameErrors = [];
      frame.contentWindow.addEventListener("error", (event) => window.__frameErrors.push(event.message || "Unknown page error"));
      frame.contentWindow.addEventListener("unhandledrejection", (event) => window.__frameErrors.push(String(event.reason || "Unhandled rejection")));
      output.hidden = false;
      output.dataset.status = "ready";
      output.textContent = JSON.stringify(snapshot());
    });

    runButton.addEventListener("click", async () => {
      if (output.dataset.status === "running") return;
      output.dataset.status = "running";
      try {
        output.textContent = JSON.stringify(await window.__runConceptInteraction());
        output.dataset.status = "pass";
      } catch (error) {
        output.textContent = JSON.stringify({ error: String(error), snapshot: snapshot() });
        output.dataset.status = "fail";
      }
    });

    frame.src = "../concepts/" + concept + "/index.html?qa=1";
  </script>
</body>
</html>
