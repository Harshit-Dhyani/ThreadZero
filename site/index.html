<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#061b3d">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"
    >
    <meta
      name="description"
      content="An independent bilingual concept for preparing a synthetic financial cyber-fraud report. It does not submit to any government system."
    >
    <title>Financial Cyber Fraud Reporting Guide</title>
    <link rel="stylesheet" href="./styles.css?v=20260827c">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header" data-shell-header>
      <div class="header-identity">
        <a class="brand" href="#home" data-route-link="home" aria-label="Financial Cyber Fraud Reporting Guide, home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-copy">
            <strong data-brand-title>Financial Cyber Fraud Reporting Guide</strong>
            <span data-brand-qualifier>Synthetic preparation demo · No government submission</span>
          </span>
        </a>

        <button class="header-menu-button" type="button" data-open-more aria-haspopup="dialog">
          <span data-header-menu-label>Services</span><span aria-hidden="true">＋</span>
        </button>

        <div class="header-utilities">
          <div class="flow-header-help"><span data-header-help-label>Actual incident?</span><strong data-header-help-action>Call 1930 manually</strong></div>
          <label class="language-control">
            <span data-language-label>Language</span>
            <select id="languageSelect" aria-label="Language">
              <option value="en">English</option>
              <option value="hi">हिन्दी</option>
            </select>
          </label>
        </div>
      </div>

      <nav class="desktop-nav" aria-label="Primary" data-primary-nav></nav>
    </header>

    <main id="main-content" tabindex="-1"></main>

    <footer class="site-footer" data-shell-footer></footer>

    <nav class="mobile-nav" aria-label="Mobile primary" data-mobile-nav></nav>

    <dialog id="simulationDialog" class="dialog">
      <form method="dialog" class="dialog-card" data-simulation-dialog-form>
        <div class="dialog-symbol" aria-hidden="true">!</div>
        <h2 data-dialog-title>This demonstration will not send anything.</h2>
        <p data-dialog-body></p>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel" data-dialog-cancel>Go back</button>
          <button class="button button-primary" value="confirm" data-dialog-confirm>Continue simulation</button>
        </div>
      </form>
    </dialog>

    <dialog id="moreDialog" class="dialog dialog-menu">
      <div class="dialog-card">
        <div class="dialog-heading-row">
          <h2 data-more-title>More services</h2>
          <button class="icon-button" type="button" data-more-close aria-label="Close menu">×</button>
        </div>
        <nav aria-label="More services" data-more-links></nav>
      </div>
    </dialog>

    <div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./app.js?v=20260827d"></script>
  </body>
</html>
